name: "Executable Stories"
description: "Surface BDD test stories in pull requests, gate releases against dev baselines, and track deployments across environments"
author: "Jag Reehal"

branding:
  icon: "book-open"
  color: "blue"

inputs:
  mode:
    description: |
      Action mode:
        - "report" (default): surface BDD stories as PR comment + HTML artifact
        - "review": generate an Evidence Review of the PR's changes — correlate the run to the diff and
          band changed code as uncovered / weak / strong. Requires a run JSON (see run-json).
        - "gate-release": verify a release candidate matches the dev test baseline
        - "deploy": record a deployment to the environment ledger
        - "ingest": push the run's StoryReport to Executable Stories Cloud (requires api-key)
        - "publish-run": commit the run JSON to an orphan branch (runs-branch) so other
          repos — e.g. a multi-repo docs hub built with executable-stories-astro — can
          fetch it from a stable raw.githubusercontent.com URL. Requires `contents: write`.

      For a living-docs site, scaffold once with `executable-stories init-astro` and
      deploy with `astro build` in your own workflow (see the README). It is no longer
      a mode of this action.
    required: false
    default: "report"
  report-dir:
    description: "Directory containing or receiving generated reports"
    required: false
    default: "reports"
  output-name:
    description: "Base filename for reports (without extension)"
    required: false
    default: "test-results"
  raw-run:
    description: "Path to raw run JSON (auto-detected if not set)"
    required: false
    default: ".executable-stories/raw-run.json"
  formatter-version:
    description: "Version of executable-stories binary to download (latest or semver)"
    required: false
    default: "latest"
  artifact-name:
    description: "Name for the uploaded GitHub artifact"
    required: false
    default: "executable-stories-report"
  comment-title:
    description: "Header text for the PR comment"
    required: false
    default: "Executable Stories"
  host-images:
    description: |
      How to handle inline screenshots so GitHub renders them in the PR comment.
        - "false" (default): replace inline base64 data URIs with a placeholder (full images remain in the HTML artifact). No write permissions needed.
        - "branch": commit screenshots to an orphan branch on this repository and rewrite the markdown to reference raw.githubusercontent.com URLs. Requires `contents: write` permission on the workflow.
    required: false
    default: "false"
  images-branch:
    description: "Branch name used when host-images: branch. Created as an orphan branch on first use."
    required: false
    default: "executable-stories-images"
  gate-dev-run:
    description: "(gate-release) Path to the dev environment test run to use as baseline"
    required: false
  gate-fail-on-regression:
    description: "(gate-release) Fail if scenarios regressed from dev to RC (default: true)"
    required: false
    default: "true"
  gate-fail-on-removal:
    description: "(gate-release) Fail if scenarios in dev are missing from RC (default: true)"
    required: false
    default: "true"
  gate-fail-on-new:
    description: "(gate-release) Fail if new scenarios appear in RC not in dev"
    required: false
    default: "false"
  gate-release-policy:
    description: "(gate-release) Path to release policy JSON with allowed exceptions"
    required: false
  deploy-env:
    description: "(deploy) Environment name to record the deployment against (e.g. dev, staging, production)"
    required: false
  deploy-tag:
    description: "(deploy) Git tag for this deployment (e.g. v1.2.3)"
    required: false
  deploy-ledger:
    description: "(deploy) Path to deployment ledger JSON"
    required: false
    default: ".executable-stories/deployments.json"
  run-json:
    description: "(review mode) Path to the run JSON (raw or canonical) to correlate against the diff. Defaults to raw-run."
    required: false
    default: ""
  base-ref:
    description: "(review mode) Base ref to diff against. Defaults to the PR base branch (GITHUB_BASE_REF)."
    required: false
    default: ""
  changed-files:
    description: "(review mode) Optional precomputed changed-files file (JSON or `git diff --name-status` text). If unset, the action computes it from git."
    required: false
    default: ""
  fail-on:
    description: "(review mode) Opt-in gate: 'uncovered' or 'weak' — fail the check when changed code lacks evidence. Default: off."
    required: false
    default: ""
  min-evidence:
    description: "(review mode) Opt-in gate: 'weak' | 'moderate' | 'strong' — fail when any claim is below this strength. Default: off."
    required: false
    default: ""
  runs-branch:
    description: "(publish-run) Branch the run JSON is committed to. Created as an orphan branch on first use."
    required: false
    default: "executable-stories-runs"
  runs-path:
    description: "(publish-run) Path of the published file within runs-branch. Give each suite its own path if one repo publishes several runs."
    required: false
    default: "raw-run.json"
  formatter-binary:
    description: "Path to a prebuilt executable-stories binary to use instead of downloading from Releases (for dev/testing before release)."
    required: false
    default: ""
  api-key:
    description: "(ingest) Executable Stories Cloud API key (es_…). Store it as a repo/org secret. When unset, ingest mode fails fast."
    required: false
    default: ""
  ingest-url:
    description: "(ingest) Base URL of the Executable Stories Cloud instance to push runs to."
    required: false
    default: "https://app.executablestories.com"

outputs:
  html-report-path:
    description: "Path to the HTML report file"
    value: ${{ steps.paths.outputs.html }}
  markdown-report-path:
    description: "Path to the Markdown report file"
    value: ${{ steps.paths.outputs.md }}
  comment-id:
    description: "ID of the created or updated PR comment"
    value: ${{ steps.comment.outputs.comment-id }}
  gate-failed:
    description: "Whether the release gate failed (true/false)"
    value: ${{ steps.detect.outputs.gate-failed }}
  deploy-ledger-path:
    description: "Path to the deployment ledger written in deploy mode"
    value: ${{ steps.detect.outputs.deploy-ledger-path }}
  published-run-url:
    description: "(publish-run) Stable raw.githubusercontent.com URL of the published run JSON"
    value: ${{ steps.publish.outputs.published-run-url }}
  ingest-run-id:
    description: "(ingest) Id of the run stored by the cloud ingest endpoint"
    value: ${{ steps.detect.outputs.ingest-run-id }}

runs:
  using: "composite"
  steps:
    - name: Detect and run
      id: detect
      shell: bash
      run: bash "${{ github.action_path }}/scripts/detect-and-format.sh"
      env:
        MODE: ${{ inputs.mode }}
        REPORT_DIR: ${{ inputs.report-dir }}
        OUTPUT_NAME: ${{ inputs.output-name }}
        RAW_RUN: ${{ inputs.raw-run }}
        RUN_JSON: ${{ inputs.run-json }}
        BASE_REF: ${{ inputs.base-ref }}
        CHANGED_FILES: ${{ inputs.changed-files }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_EVIDENCE: ${{ inputs.min-evidence }}
        FORMATTER_VERSION: ${{ inputs.formatter-version }}
        FORMATTER_BINARY: ${{ inputs.formatter-binary }}
        GATE_DEV_RUN: ${{ inputs.gate-dev-run }}
        GATE_FAIL_ON_REGRESSION: ${{ inputs.gate-fail-on-regression }}
        GATE_FAIL_ON_REMOVAL: ${{ inputs.gate-fail-on-removal }}
        GATE_FAIL_ON_NEW: ${{ inputs.gate-fail-on-new }}
        GATE_RELEASE_POLICY: ${{ inputs.gate-release-policy }}
        DEPLOY_ENV: ${{ inputs.deploy-env }}
        DEPLOY_TAG: ${{ inputs.deploy-tag }}
        DEPLOY_LEDGER: ${{ inputs.deploy-ledger }}
        API_KEY: ${{ inputs.api-key }}
        INGEST_URL: ${{ inputs.ingest-url }}
        GH_TOKEN: ${{ github.token }}

    - name: Set output paths
      id: paths
      shell: bash
      run: |
        echo "html=${{ inputs.report-dir }}/${{ inputs.output-name }}.html" >> "$GITHUB_OUTPUT"
        echo "md=${{ inputs.report-dir }}/${{ inputs.output-name }}.md" >> "$GITHUB_OUTPUT"

    - name: Upload HTML report
      if: inputs.mode == 'report' || inputs.mode == 'review' || inputs.mode == 'gate-release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}/${{ inputs.output-name }}.html

    - name: Post or update PR comment
      id: comment
      if: (inputs.mode == 'report' || inputs.mode == 'review' || inputs.mode == 'gate-release') && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        COMMENT_TITLE: ${{ inputs.comment-title }}
        MD_PATH: ${{ inputs.report-dir }}/${{ inputs.output-name }}.md
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        HOST_IMAGES: ${{ inputs.host-images }}
        IMAGES_BRANCH: ${{ inputs.images-branch }}
      with:
        script: |
          const fs = require('fs');
          const title = process.env.COMMENT_TITLE;
          const mdPath = process.env.MD_PATH;
          const artifactName = process.env.ARTIFACT_NAME;
          const hostImages = (process.env.HOST_IMAGES || 'false').toLowerCase();
          const imagesBranch = process.env.IMAGES_BRANCH || 'executable-stories-images';

          // Read markdown content
          let mdContent = '';
          try {
            mdContent = fs.readFileSync(mdPath, 'utf8');
          } catch (e) {
            core.warning(`Could not read markdown report at ${mdPath}: ${e.message}`);
            return;
          }

          // host-images: branch — commit each inline base64 screenshot to an orphan
          // branch and rewrite the markdown to reference the public raw URL, so the
          // images render inline in the PR comment. Falls back to placeholder mode
          // on any failure (e.g. missing contents: write permission).
          if (hostImages === 'branch') {
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const prNumber = context.issue.number;
              const runId = process.env.GITHUB_RUN_ID;

              const dataUriRegex = /!\[([^\]]*)\]\(data:([^;)]+);base64,([^)]+)\)/g;
              const matches = [];
              let m;
              while ((m = dataUriRegex.exec(mdContent)) !== null) {
                matches.push({ full: m[0], alt: m[1], mime: m[2], base64: m[3] });
              }

              if (matches.length > 0) {
                const slugify = (s) => (s || 'screenshot').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'screenshot';
                const extFor = (mime) => ({
                  'image/png': 'png',
                  'image/jpeg': 'jpg',
                  'image/gif': 'gif',
                  'image/webp': 'webp',
                  'image/svg+xml': 'svg',
                }[mime] || 'bin');

                // Ensure the images branch exists (create as orphan with a README on first use)
                let branchSha = null;
                try {
                  const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${imagesBranch}` });
                  branchSha = ref.object.sha;
                } catch (e) {
                  if (e.status !== 404) throw e;
                  const { data: readmeBlob } = await github.rest.git.createBlob({
                    owner, repo,
                    content: '# Executable Stories Images\n\nAuto-generated by `jagreehal/executable-stories-action`. Each subdirectory holds screenshots from one PR run, referenced inline in the PR comment via `raw.githubusercontent.com` URLs. Safe to delete old `pr-*` directories at any time.\n',
                    encoding: 'utf-8',
                  });
                  const { data: initialTree } = await github.rest.git.createTree({
                    owner, repo,
                    tree: [{ path: 'README.md', mode: '100644', type: 'blob', sha: readmeBlob.sha }],
                  });
                  const { data: initialCommit } = await github.rest.git.createCommit({
                    owner, repo,
                    message: 'chore: init executable-stories images branch',
                    tree: initialTree.sha,
                    parents: [],
                  });
                  await github.rest.git.createRef({
                    owner, repo,
                    ref: `refs/heads/${imagesBranch}`,
                    sha: initialCommit.sha,
                  });
                  branchSha = initialCommit.sha;
                }

                const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: branchSha });

                const treeEntries = [];
                const replacements = [];
                for (let i = 0; i < matches.length; i++) {
                  const { full, alt, mime, base64 } = matches[i];
                  const filename = `${String(i + 1).padStart(3, '0')}-${slugify(alt)}.${extFor(mime)}`;
                  const path = `pr-${prNumber}/${runId}/${filename}`;
                  const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: base64, encoding: 'base64' });
                  treeEntries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
                  replacements.push({ original: full, alt, path });
                }

                const { data: newTree } = await github.rest.git.createTree({
                  owner, repo,
                  base_tree: baseCommit.tree.sha,
                  tree: treeEntries,
                });
                const { data: newCommit } = await github.rest.git.createCommit({
                  owner, repo,
                  message: `images: PR #${prNumber} run ${runId}`,
                  tree: newTree.sha,
                  parents: [branchSha],
                });
                await github.rest.git.updateRef({
                  owner, repo,
                  ref: `heads/${imagesBranch}`,
                  sha: newCommit.sha,
                });

                for (const r of replacements) {
                  const url = `https://raw.githubusercontent.com/${owner}/${repo}/${newCommit.sha}/${r.path}`;
                  mdContent = mdContent.replace(r.original, `![${r.alt}](${url})`);
                }
                core.info(`Hosted ${matches.length} image(s) on ${imagesBranch}@${newCommit.sha.slice(0, 7)}`);
              }
            } catch (e) {
              core.warning(`host-images: branch failed (${e.message}); falling back to placeholder mode. Hint: ensure the workflow has \`permissions: contents: write\`.`);
            }
          }

          // Replace any remaining inline base64 data URIs (the host-images branch path
          // converted them to public URLs, so this only fires when host-images is off
          // or the branch upload failed). GitHub blocks data: URIs in comments anyway.
          // Matches: ![alt](data:<mime>;base64,<chars>)
          let strippedImages = 0;
          mdContent = mdContent.replace(
            /!\[([^\]]*)\]\(data:[^;)]+;base64,[^)]+\)/g,
            (_match, alt) => {
              strippedImages++;
              const label = alt && alt.trim() ? alt.trim() : 'Screenshot';
              return `_📎 ${label} (see HTML report)_`;
            }
          );
          if (strippedImages > 0) {
            core.info(`Stripped ${strippedImages} inline base64 image(s) from PR comment`);
          }

          // Truncate at a markdown-safe boundary if still over GitHub's comment limit
          // (~65536 chars). Cut on the last newline before the limit so we never split
          // a token mid-stream.
          const MAX_CONTENT = 55000;
          let truncated = false;
          if (mdContent.length > MAX_CONTENT) {
            const slice = mdContent.substring(0, MAX_CONTENT);
            const lastNewline = slice.lastIndexOf('\n');
            mdContent = lastNewline > 0 ? slice.substring(0, lastNewline) : slice;
            truncated = true;
          }

          // Build comment body
          const marker = `<!-- executable-stories: ${title} -->`;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          let body = `${marker}\n## ${title}\n\n`;
          body += `<details>\n<summary>View Stories</summary>\n\n`;
          body += mdContent + '\n';
          if (truncated) {
            body += '\n\n> **Report truncated.** Download the full HTML report for complete details.\n';
          }
          body += `\n</details>\n\n`;
          body += `---\n[Download full HTML report](${runUrl}) (artifact: \`${artifactName}\`)\n`;

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));

          let commentId;
          if (existing) {
            const { data: updated } = await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            commentId = updated.id;
            core.info(`Updated existing comment ${commentId}`);
          } else {
            const { data: created } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            commentId = created.id;
            core.info(`Created comment ${commentId}`);
          }

          core.setOutput('comment-id', commentId);

    - name: Publish run JSON
      id: publish
      if: inputs.mode == 'publish-run'
      uses: actions/github-script@v7
      env:
        RUNS_BRANCH: ${{ inputs.runs-branch }}
        RUNS_PATH: ${{ inputs.runs-path }}
        SOURCE_JSON: ${{ steps.detect.outputs.publish-source }}
      with:
        script: |
          const fs = require('fs');
          const crypto = require('crypto');
          const branch = process.env.RUNS_BRANCH;
          const filePath = process.env.RUNS_PATH;
          const source = process.env.SOURCE_JSON;
          const { owner, repo } = context.repo;

          const content = fs.readFileSync(source, 'utf8');
          const publishedUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;

          // Git blob sha of the new content, so an unchanged run is a no-op
          // instead of an empty-diff commit on every scheduled build.
          const blobSha = crypto.createHash('sha1')
            .update(`blob ${Buffer.byteLength(content)}\0`)
            .update(content)
            .digest('hex');

          // Ordering signal for the stale-publish guard below: without it, an
          // older CI job that merely finishes last (or loses a ref race and
          // retries) would overwrite a newer run until the next build.
          let newFinishedAtMs = 0;
          try {
            const parsed = JSON.parse(content);
            if (typeof parsed.finishedAtMs === 'number') newFinishedAtMs = parsed.finishedAtMs;
          } catch { /* validated upstream; treat as unordered */ }

          // One publish attempt: read the branch tip fresh, then commit on it.
          // Concurrent runs race at createRef (orphan init) / updateRef; both
          // surface as 422s, which the retry loop below resolves by re-reading
          // the tip — the Git Data API has no atomic compare-and-create.
          async function publishOnce() {
            // Ensure the runs branch exists (create as orphan with a README on first use)
            let branchSha = null;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              branchSha = ref.object.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
              const { data: readmeBlob } = await github.rest.git.createBlob({
                owner, repo,
                content: '# Executable Stories Runs\n\nAuto-generated by `jagreehal/executable-stories-action` (mode: publish-run). Holds the latest test run JSON at a stable path so other repos — e.g. a multi-repo docs hub built with `executable-stories-astro` — can fetch it from `raw.githubusercontent.com`. Do not edit by hand.\n',
                encoding: 'utf-8',
              });
              const { data: initialTree } = await github.rest.git.createTree({
                owner, repo,
                tree: [{ path: 'README.md', mode: '100644', type: 'blob', sha: readmeBlob.sha }],
              });
              const { data: initialCommit } = await github.rest.git.createCommit({
                owner, repo,
                message: 'chore: init executable-stories runs branch',
                tree: initialTree.sha,
                parents: [],
              });
              await github.rest.git.createRef({
                owner, repo,
                ref: `refs/heads/${branch}`,
                sha: initialCommit.sha,
              });
              branchSha = initialCommit.sha;
            }

            // Skip the commit when the published file already has this content,
            // and refuse to clobber a NEWER run with this one (an older job
            // finishing last must not regress the published state). getContent
            // omits inline content above ~1MB, so fall back to the Git Data API
            // to preserve ordering for large, screenshot-heavy run files.
            try {
              const { data: existing } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
              if (!Array.isArray(existing)) {
                if (existing.sha === blobSha) {
                  core.info(`Run JSON unchanged; ${branch}/${filePath} already up to date.`);
                  return;
                }
                if (newFinishedAtMs > 0) {
                  try {
                    let existingContent = existing.content;
                    if (!existingContent) {
                      const { data: existingBlob } = await github.rest.git.getBlob({
                        owner,
                        repo,
                        file_sha: existing.sha,
                      });
                      existingContent = existingBlob.content;
                    }
                    const prev = JSON.parse(Buffer.from(existingContent, 'base64').toString('utf8'));
                    if (typeof prev.finishedAtMs === 'number' && prev.finishedAtMs > newFinishedAtMs) {
                      core.warning(
                        `Skipping publish: ${branch}/${filePath} already holds a newer run ` +
                        `(finishedAtMs ${prev.finishedAtMs} > ${newFinishedAtMs}). This job's results are stale.`,
                      );
                      return;
                    }
                  } catch { /* existing file unparseable — overwrite it */ }
                }
              }
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: branchSha });
            const { data: blob } = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
            const { data: newTree } = await github.rest.git.createTree({
              owner, repo,
              base_tree: baseCommit.tree.sha,
              tree: [{ path: filePath, mode: '100644', type: 'blob', sha: blob.sha }],
            });
            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: `runs: publish ${filePath} from ${context.sha.slice(0, 7)}`,
              tree: newTree.sha,
              parents: [branchSha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: newCommit.sha });
            core.info(`Published ${filePath} to ${branch}@${newCommit.sha.slice(0, 7)}`);
          }

          const MAX_ATTEMPTS = 3;
          for (let attempt = 1; ; attempt++) {
            try {
              await publishOnce();
              break;
            } catch (e) {
              const retriable =
                e.status === 422 || /fast forward|reference already exists/i.test(e.message ?? '');
              if (!retriable || attempt >= MAX_ATTEMPTS) throw e;
              core.info(`Ref conflict on ${branch} (attempt ${attempt}/${MAX_ATTEMPTS}) — a concurrent run won the race; retrying on the new tip.`);
            }
          }

          core.notice(`Run JSON published: ${publishedUrl}`);
          core.setOutput('published-run-url', publishedUrl);

    - name: Enforce release gate
      if: inputs.mode == 'gate-release' && steps.detect.outputs.gate-failed == 'true'
      shell: bash
      run: |
        echo "::error::Release gate failed — RC does not match dev baseline."
        echo "::error::Check the gate-release report artifact for details."
        exit 1

    - name: Enforce review gate
      if: always() && inputs.mode == 'review' && steps.detect.outputs.gate-failed == 'true'
      shell: bash
      run: |
        echo "::error::Evidence Review gate failed — changed code lacks sufficient evidence. See the PR comment or the HTML report artifact for the uncovered/weak files."
        exit 1

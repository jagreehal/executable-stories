[package]
name = "executable-stories"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "BDD story documentation for Rust tests"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jagreehal/executable-stories"
repository = "https://github.com/jagreehal/executable-stories.git"
documentation = "https://github.com/jagreehal/executable-stories#readme"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opentelemetry = { version = "0.32", optional = true }

[features]
otel = ["opentelemetry"]

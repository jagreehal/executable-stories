name: Release

on:
  push:
    branches:
      - main

permissions:
  id-token: write      # Required for OIDC provenance
  contents: write      # Required for creating releases/tags
  pull-requests: write # Required for creating Version Packages PR

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # npm trusted publishing currently requires npm CLI 11.5.1+.
          # Using Node 24 ensures the bundled npm meets that bar without a
          # separate global npm upgrade step.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  formatters-binaries:
    name: Build and attach formatters binaries
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Build formatters binaries (multi-platform)
        working-directory: packages/executable-stories-formatters
        run: |
          bun build src/cli.ts --compile --target=bun-linux-x64 --outfile executable-stories-linux-x64
          bun build src/cli.ts --compile --target=bun-linux-arm64 --outfile executable-stories-linux-arm64
          bun build src/cli.ts --compile --target=bun-darwin-x64 --outfile executable-stories-darwin-x64
          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile executable-stories-darwin-arm64
          bun build src/cli.ts --compile --target=bun-windows-x64 --outfile executable-stories-windows-x64

      - name: Upload formatters binaries
        uses: actions/upload-artifact@v4
        with:
          name: formatters-binaries
          path: |
            packages/executable-stories-formatters/executable-stories-linux-x64
            packages/executable-stories-formatters/executable-stories-linux-arm64
            packages/executable-stories-formatters/executable-stories-darwin-x64
            packages/executable-stories-formatters/executable-stories-darwin-arm64
            packages/executable-stories-formatters/executable-stories-windows-x64.exe

      - name: Get formatters release tag
        id: tag
        run: |
          VERSION=$(jq -r '.version' packages/executable-stories-formatters/package.json)
          echo "tag=executable-stories-formatters@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            packages/executable-stories-formatters/executable-stories-linux-x64 \
            packages/executable-stories-formatters/executable-stories-linux-arm64 \
            packages/executable-stories-formatters/executable-stories-darwin-x64 \
            packages/executable-stories-formatters/executable-stories-darwin-arm64 \
            packages/executable-stories-formatters/executable-stories-windows-x64.exe \
            --clobber

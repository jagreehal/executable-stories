name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jagreehal'
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # npm trusted publishing currently requires npm CLI 11.5.1+.
          # Using Node 24 ensures the bundled npm meets that bar without a
          # separate global npm upgrade step.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Cache pnpm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          publish: pnpm release
          # Also rewrites SKILL.md library_version, which changeset version
          # alone leaves stale and CI then fails on.
          version: pnpm version-packages
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  formatters-binaries:
    name: Build and attach formatters binaries
    needs: release
    if: github.repository_owner == 'jagreehal' && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Cache pnpm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.0"

      # Build the workspace first so the binary compile can resolve
      # executable-stories-core's built subpaths (its exports map points at
      # dist/*) and so executable-stories-react's assets exist for embedding.
      - name: Build packages
        run: pnpm build

      - name: Build formatters binaries (multi-platform)
        working-directory: packages/executable-stories-formatters
        run: |
          node scripts/embed-react-assets.mjs
          bun build src/cli.ts --compile --target=bun-linux-x64 --outfile executable-stories-linux-x64
          bun build src/cli.ts --compile --target=bun-linux-arm64 --outfile executable-stories-linux-arm64
          bun build src/cli.ts --compile --target=bun-darwin-x64 --outfile executable-stories-darwin-x64
          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile executable-stories-darwin-arm64
          bun build src/cli.ts --compile --target=bun-windows-x64 --outfile executable-stories-windows-x64

      - name: Upload formatters binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatters-binaries
          path: |
            packages/executable-stories-formatters/executable-stories-linux-x64
            packages/executable-stories-formatters/executable-stories-linux-arm64
            packages/executable-stories-formatters/executable-stories-darwin-x64
            packages/executable-stories-formatters/executable-stories-darwin-arm64
            packages/executable-stories-formatters/executable-stories-windows-x64.exe
          # binaries are attached to the GitHub Release below; this artifact is a short-lived copy
          retention-days: 7

      - name: Get formatters release tag
        id: tag
        run: |
          VERSION=$(jq -r '.version' packages/executable-stories-formatters/package.json)
          echo "tag=executable-stories-formatters@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --draft --notes "" || true

      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            packages/executable-stories-formatters/executable-stories-linux-x64 \
            packages/executable-stories-formatters/executable-stories-linux-arm64 \
            packages/executable-stories-formatters/executable-stories-darwin-x64 \
            packages/executable-stories-formatters/executable-stories-darwin-arm64 \
            packages/executable-stories-formatters/executable-stories-windows-x64.exe \
            --clobber

name: Non-JS CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/executable-stories-go/**"
      - "packages/executable-stories-junit5/**"
      - "packages/executable-stories-pytest/**"
      - "packages/executable-stories-rust/**"
      - "packages/executable-stories-xunit/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/executable-stories-go/**"
      - "packages/executable-stories-junit5/**"
      - "packages/executable-stories-pytest/**"
      - "packages/executable-stories-rust/**"
      - "packages/executable-stories-xunit/**"

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/executable-stories-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  junit5:
    name: JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/executable-stories-junit5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/executable-stories-pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/executable-stories-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/executable-stories-rust
      - run: cargo test --all-features
      - run: cargo package --allow-dirty

  xunit:
    name: xUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/executable-stories-xunit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - run: dotnet build ExecutableStories.Xunit.Tests/ExecutableStories.Xunit.Tests.csproj --nologo
      - run: dotnet test ExecutableStories.Xunit.Tests/ExecutableStories.Xunit.Tests.csproj --nologo

name: Non-JS Release

on:
  push:
    tags:
      - "go-executable-stories-v*"
      - "junit5-v*"
      - "pytest-v*"
      - "ruby-v*"
      - "rust-v*"
      - "xunit-v*"

permissions:
  contents: read

jobs:
  go:
    name: Publish Go
    if: startsWith(github.ref, 'refs/tags/go-executable-stories-v')
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Test
        working-directory: packages/executable-stories-go
        run: go test ./...

  junit5:
    name: Publish JUnit 5 (Maven Central)
    if: startsWith(github.ref, 'refs/tags/junit5-v')
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: packages/executable-stories-junit5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew test
      - name: Publish
        run: ./gradlew publishAllPublicationsToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  pytest:
    name: Publish pytest (PyPI)
    if: startsWith(github.ref, 'refs/tags/pytest-v')
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: packages/executable-stories-pytest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q
      - run: pip install build twine
      - name: Build
        run: python -m build
      - name: Publish
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  rust:
    name: Publish Rust (crates.io)
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: packages/executable-stories-rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-features
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  ruby:
    name: Publish Ruby (RubyGems)
    if: startsWith(github.ref, 'refs/tags/ruby-v')
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: packages/executable-stories-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler: "2.5.23"
          bundler-cache: true
          working-directory: packages/executable-stories-ruby
      - name: Test
        run: bundle exec rake test
      - name: Lint
        run: bundle exec rubocop lib/ test/
      - name: Build
        run: gem build executable_stories.gemspec --strict
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#ruby-v}"
          gem push "executable-stories-ruby-${VERSION}.gem"
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  xunit:
    name: Publish xUnit (NuGet)
    if: startsWith(github.ref, 'refs/tags/xunit-v')
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: packages/executable-stories-xunit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0"
      - name: Test
        run: |
          dotnet build ExecutableStories.Xunit.Tests/ExecutableStories.Xunit.Tests.csproj --nologo
          dotnet test ExecutableStories.Xunit.Tests/ExecutableStories.Xunit.Tests.csproj --nologo
      - name: Pack
        run: dotnet pack ExecutableStories.Xunit/ExecutableStories.Xunit.csproj --configuration Release --nologo -p:NuGetAudit=false
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#xunit-v}"
          dotnet nuget push "ExecutableStories.Xunit/bin/Release/ExecutableStories.Xunit.${VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}"

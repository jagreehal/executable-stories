name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # OIDC for auth (e.g. artifact upload, future signing)
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.28.1 --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      # Build the workspace first so the binary compile can resolve
      # executable-stories-core's built subpaths (its exports map points at
      # dist/*). turbo caches this, so the later Quality build is a cache hit.
      - name: Build packages
        run: pnpm build

      - name: Build formatters binary
        if: hashFiles('packages/executable-stories-formatters/package.json') != ''
        run: cd packages/executable-stories-formatters && pnpm run compile

      - name: Install Playwright browsers
        run: pnpm --filter executable-stories-playwright exec playwright install --with-deps && pnpm --filter playwright-example exec playwright install && pnpm --filter formatters-e2e exec playwright install

      - name: Quality (build, lint, type-check, test)
        run: pnpm quality
        env:
          CI: true

  # The Vitest adapter declares `vitest: ">=4.1.5"`. The job above only ever
  # exercises whatever the dev dependency happens to pin, so the rest of that
  # range is an untested promise. This runs the adapter against both ends of
  # it. Versions are pinned exactly rather than floated (`4`, `^4.1.5`) so a
  # freshly published 4.x cannot fail the job on the workspace's 7-day
  # supply-chain quarantine.
  peer-range:
    name: vitest ${{ matrix.vitest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest:
          - "4.1.5" # the declared floor
          - "4.1.11" # newest 4.x, the version the rest of the workspace uses

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.28.1 --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The adapter imports executable-stories-core and -formatters through
      # their exports maps, which point at dist/*. Those have to exist before
      # its vitest.config.ts can load the reporter.
      - name: Build packages
        run: pnpm build

      - name: Downgrade vitest to ${{ matrix.vitest }}
        run: pnpm --filter executable-stories-vitest add -D vitest@${{ matrix.vitest }}
        env:
          CI: true

      - name: Type-check against vitest ${{ matrix.vitest }} types
        run: pnpm --filter executable-stories-vitest type-check

      - name: Test against vitest ${{ matrix.vitest }}
        run: pnpm --filter executable-stories-vitest test
        env:
          CI: true

  dependabot-auto-merge:
    needs: [build-and-test, peer-range]
    runs-on: ubuntu-latest
    # The workflow-level grant is contents: read, which cannot merge. Raise it
    # for this job alone rather than for the whole file.
    permissions:
      contents: write
      pull-requests: write
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
